<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BoviFutures</title>

<link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="hero">
        <h1>BoviFutures</h1>
        <p>Monitorização de mercado de bovinos vivos e carcaças</p>
    </header>

    <!-- KPI CARDS -->
    <section class="kpis">

        <div class="card">
            <h3>Preço Vivo PT</h3>
            <div id="precoVivoPT">--</div>
        </div>

        <div class="card">
            <h3>Preço Carcaça PT</h3>
            <div id="precoCarcacaPT">--</div>
        </div>

        <div class="card">
            <h3>Vivo → Carcaça</h3>
            <div id="convertido">--</div>
        </div>

        <div class="card">
            <h3>Spread</h3>
            <div id="spread">--</div>
        </div>

    </section>

    <!-- SIMULADOR -->
    <section class="simulator">

        <h2>Simulador</h2>

        <label>Nº Animais</label>
        <input id="animais" type="number" value="30">

        <label>Peso Vivo Médio (kg)</label>
        <input id="peso" type="number" value="600">

        <label>Rendimento (%)</label>
        <input id="rendimento" type="number" value="58">

        <button onclick="simular()">Simular</button>

        <div id="resultado"></div>

    </section>

</div>

<script src="js/market-engine.js"></script>
<script src="js/simulator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
