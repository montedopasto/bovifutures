<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BoviFutures</title>

<link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>BoviFutures</h2>

        <nav>
            <a class="active">Dashboard</a>
            <a>Bovino Vivo</a>
            <a>Carcaças</a>
            <a>Simulador</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <div class="topbar">
    <div id="estadoMercado">--</div>
    <div id="scoreMercado">--</div>

    <div id="infoData"></div>
    <div id="infoHora"></div>
    <div id="infoSemana"></div>
</div>

        <!-- KPIs -->
        <div class="kpi-row">

            <div class="kpi">
                <span>Vivo PT</span>
                <h2 id="precoVivoPT">--</h2>
            </div>

            <div class="kpi">
                <span>Carcaça PT</span>
                <h2 id="precoCarcacaPT">--</h2>
            </div>


        </div>

        <!-- GRID -->
        <div class="grid">
<div class="card full">
    <h3>Leitura de Mercado</h3>
    <p id="textoMercado"></p>
</div>
            <!-- CHART -->
            <div class="card big">
                <h3>Evolução de Preços</h3>
                <canvas id="graficoPrecos"></canvas>
            </div>
<div class="card full">
    <h3>Previsão de Mercado</h3>
    <div id="previsaoFutura"></div>
</div>
            <!-- DRIVERS -->
            <div class="card">
                <h3>Drivers</h3>
                <div class="driver">
                    Preços
                    <div class="bar"><div class="fill" style="width:70%"></div></div>
                </div>
                <div class="driver">
                    Procura
                    <div class="bar"><div class="fill" style="width:60%"></div></div>
                </div>
            </div>
<div class="card full">
    <h3>Registo Semanal de Preços</h3>

    <label>Data</label>
    <input id="semana" type="text" placeholder="Ex: 2026-W14">

    <label>Tipo</label>
    <select id="tipoPreco">
        <option value="carcaca">Carcaça</option>
        <option value="vivo">Vivo</option>
    </select>

    <label>Preço (€/kg)</label>
    <input id="valorPreco" type="number" step="0.01">

    <button onclick="guardarPreco()">Guardar</button>
</div>
            <!-- SIMULADOR -->
            <div class="card full">
                <h3>Simulador</h3>

                <input id="animais" type="number" value="30">
                <input id="peso" type="number" value="600">
                <input id="rendimento" type="number" value="58">

                <button onclick="simular()">Simular</button>

                <div id="resultado"></div>
            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/data.js"></script>
<script src="js/forecast.js"></script>
<script src="js/market-engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/simulator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
