<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BoviFutures</title>

<link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>BoviFutures</h2>

        <nav>
            <a class="active">Dashboard</a>
            <a>Bovino Vivo</a>
            <a>Carcaças</a>
            <a>Simulador</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <div class="topbar">
    <div id="estadoMercado">--</div>
    <div id="scoreMercado">--</div>
</div>

        <!-- KPIs -->
        <div class="kpi-row">

            <div class="kpi">
                <span>Vivo PT</span>
                <h2 id="precoVivoPT">--</h2>
            </div>

            <div class="kpi">
                <span>Carcaça PT</span>
                <h2 id="precoCarcacaPT">--</h2>
            </div>

            <div class="kpi">
                <span>Vivo → Carcaça</span>
                <h2 id="convertido">--</h2>
            </div>

            <div class="kpi">
                <span>Spread</span>
                <h2 id="spread">--</h2>
            </div>

        </div>

        <!-- GRID -->
        <div class="grid">

            <!-- CHART -->
            <div class="card big">
                <h3>Evolução de Preços</h3>
                <div class="fake-chart"></div>
            </div>

            <!-- DRIVERS -->
            <div class="card">
                <h3>Drivers</h3>
                <div class="driver">
                    Preços
                    <div class="bar"><div class="fill" style="width:70%"></div></div>
                </div>
                <div class="driver">
                    Procura
                    <div class="bar"><div class="fill" style="width:60%"></div></div>
                </div>
            </div>

            <!-- SIMULADOR -->
            <div class="card full">
                <h3>Simulador</h3>

                <input id="animais" type="number" value="30">
                <input id="peso" type="number" value="600">
                <input id="rendimento" type="number" value="58">

                <button onclick="simular()">Simular</button>

                <div id="resultado"></div>
            </div>

        </div>

    </main>

</div>

<script src="js/market-engine.js"></script>
<script src="js/simulator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
